<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>writingscored</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #677085; --line: #e3e6ec;
    --accent: #2f6fde; --accent-soft: #e8f0fd; --ok: #1f8a4c; --ok-soft: #e6f5ec;
    --warn: #b26a00; --warn-soft: #fdf3e2; --bad: #c0392b; --bad-soft: #fbeaea;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); font-weight: 600; }
  main { max-width: 1150px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 300px 1fr; gap: 16px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  h2 { font-size: 16px; margin: 0 0 10px; } h3 { font-size: 14px; margin: 14px 0 6px; }
  .muted { color: var(--muted); font-size: 13px; }
  button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); padding: 7px 12px; border-radius: 8px; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .55; cursor: wait; }
  input, select, textarea { font: inherit; width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); }
  textarea { resize: vertical; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 3px; }
  .list-item { padding: 9px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .list-item:hover { background: var(--bg); }
  .list-item.active { background: var(--accent-soft); border-color: #c8dafb; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .pill { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--bg); color: var(--muted); white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.info { background: var(--accent-soft); color: var(--accent); }
  .prompt { white-space: pre-wrap; background: var(--bg); padding: 10px; border-radius: 8px; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
  .thumbs img { height: 110px; border-radius: 6px; border: 1px solid var(--line); cursor: zoom-in; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 700px) { .split { grid-template-columns: 1fr; } }
  .split .imgcol { max-height: 520px; overflow: auto; }
  .split .imgcol img { width: 100%; border-radius: 6px; border: 1px solid var(--line); margin-bottom: 6px; }
  .notice { padding: 9px 11px; border-radius: 8px; font-size: 14px; margin: 8px 0; }
  .notice.warn { background: var(--warn-soft); color: var(--warn); } .notice.ok { background: var(--ok-soft); color: var(--ok); } .notice.bad { background: var(--bad-soft); color: var(--bad); } .notice.info { background: var(--accent-soft); color: var(--accent); }
  .bands { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  @media (max-width: 700px) { .bands { grid-template-columns: 1fr 1fr; } }
  .band { border: 1px solid var(--line); border-radius: 8px; padding: 9px; }
  .band b { font-size: 22px; display: block; }
  .overall { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  .overall .big { font-size: 40px; font-weight: 700; color: var(--accent); line-height: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  tr.click { cursor: pointer; } tr.click:hover { background: var(--bg); }
  .essay { white-space: pre-wrap; background: var(--bg); padding: 12px; border-radius: 8px; line-height: 1.9; }
  mark.err { border-radius: 3px; padding: 1px 2px; cursor: pointer; color: inherit; }
  mark.err.major { background: #fde0de; border-bottom: 2px solid #d93025; }
  mark.err.minor { background: #fff1b8; border-bottom: 2px solid #e3a400; }
  mark.err sup { font-size: 10px; font-weight: 700; margin-left: 1px; color: var(--muted); }
  .errlist { padding-left: 22px; } .errlist li { margin: 6px 0; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  .errlist .fix { color: var(--ok); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .active-err { outline: 2px solid var(--accent); outline-offset: 1px; }
  details summary { cursor: pointer; color: var(--accent); margin: 8px 0; }
  .improved { white-space: pre-wrap; background: var(--ok-soft); padding: 10px; border-radius: 8px; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .zoom { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: flex; align-items: center; justify-content: center; z-index: 20; cursor: zoom-out; }
  .zoom img { max-width: 95vw; max-height: 95vh; }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
</style>
</head>
<body>
<header>
  <h1>📝 writingscored</h1>
  <a href="/speaking.html" style="color:var(--accent);text-decoration:none;font-size:14px">🎤 Luyện nói</a>
  <span id="demoBadge" class="badge"></span>
  <label style="margin:0">Đăng nhập là</label>
  <select id="userSelect" style="width:auto"></select>
</header>
<main>
  <aside>
    <div class="card">
      <div class="row"><h2 class="grow" style="margin:0">Bài tập</h2><button id="newBtn" hidden>+ Giao bài</button></div>
      <div id="assignmentList" style="margin-top:8px"></div>
    </div>
  </aside>
  <section id="content"><div class="card empty">Chọn một bài tập bên trái.</div></section>
</main>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtBand = (b) => (b == null ? "–" : Number(b).toFixed(1));
const wordCount = (t) => (t.match(/[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*/g) || []).length;

const state = { users: [], me: null, assignments: [], selected: null, view: null, subId: null, typing: false };

async function api(url, opts = {}) {
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Lỗi ${res.status}`);
  return data;
}
const postJson = (url, body) => api(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

// Thu nhỏ ảnh chụp điện thoại trước khi tải lên (tối đa 2000px, JPEG)
const isHeic = (f) => /hei[cf]/i.test(f.type) || /\.hei[cf]$/i.test(f.name);

async function compressImage(file, maxSide = 2000) {
  let img;
  try { img = await createImageBitmap(file); } catch { return file; } // HEIC: trình duyệt không đọc được → máy chủ tự chuyển
  if (isHeic(file)) return file;
  const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
  const canvas = Object.assign(document.createElement("canvas"), { width: Math.round(img.width * scale), height: Math.round(img.height * scale) });
  canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
  const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.85));
  return new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" });
}

function zoom(src) {
  const d = Object.assign(document.createElement("div"), { className: "zoom", innerHTML: `<img src="${esc(src)}">` });
  d.onclick = () => d.remove();
  document.body.append(d);
}
document.addEventListener("click", (e) => { if (e.target.matches("[data-zoom]")) zoom(e.target.src); });

// ---------- Khởi động ----------

async function init() {
  const meta = await api("/api/meta");
  state.users = meta.users;
  $("#demoBadge").textContent = meta.demo ? "CHẾ ĐỘ DEMO – kết quả AI là dữ liệu mẫu" : `AI: ${meta.models.join(" → dự phòng ")}`;
  if (!meta.demo) $("#demoBadge").style.cssText = "background:var(--ok-soft);color:var(--ok)";
  const saved = localStorage.getItem("me");
  $("#userSelect").innerHTML = meta.users.map((u) => `<option value="${u.id}">${esc(u.name)}</option>`).join("");
  $("#userSelect").value = meta.users.some((u) => u.id === saved) ? saved : meta.users[0].id;
  $("#userSelect").onchange = () => { localStorage.setItem("me", $("#userSelect").value); switchUser(); };
  $("#newBtn").onclick = () => { state.selected = null; renderList(); renderNewForm(); };
  switchUser();
}

async function switchUser() {
  state.me = state.users.find((u) => u.id === $("#userSelect").value);
  $("#newBtn").hidden = state.me.role !== "teacher";
  state.selected = null;
  await loadAssignments();
  $("#content").innerHTML = `<div class="card empty">Chọn một bài tập bên trái.</div>`;
}

async function loadAssignments() {
  state.assignments = await api("/api/assignments");
  state.mySubs = state.me.role === "student" ? await api(`/api/submissions?studentId=${state.me.id}`) : [];
  renderList();
}

const STATUS = {
  draft: ["Chưa nộp", ""], transcribed: ["Đang soát bản chép", "warn"],
  graded: ["AI đã chấm – chờ GV duyệt", "info"], reviewed: ["GV đã duyệt", "ok"],
};

function renderList() {
  const el = $("#assignmentList");
  if (!state.assignments.length) { el.innerHTML = `<p class="muted">Chưa có bài tập nào.</p>`; return; }
  el.innerHTML = state.assignments.map((a) => {
    let right = `<span class="pill">${TASK_NAME[a.taskType] || "Task 2"}</span>`;
    if (state.me.role === "student") {
      const s = state.mySubs.find((x) => x.assignmentId === a.id);
      const [label, cls] = STATUS[s?.status || "draft"];
      right = `<span class="pill ${cls}">${label}</span>`;
    }
    return `<div class="list-item ${state.selected === a.id ? "active" : ""}" data-id="${a.id}">
      <div class="row"><b class="grow">${esc(a.title)}</b></div>
      <div class="row"><span class="muted grow">${a.dueDate ? "Hạn: " + esc(a.dueDate) : "Không hạn"}</span>${right}</div>
    </div>`;
  }).join("");
  el.querySelectorAll(".list-item").forEach((n) => (n.onclick = () => openAssignment(n.dataset.id)));
}

async function openAssignment(id) {
  state.selected = id; state.subId = null; state.typing = false;
  renderList();
  if (state.me.role === "teacher") renderTeacherAssignment(); else renderStudentAssignment();
}

const TASK_NAME = { task1: "Task 1 Academic", task1gt: "Task 1 General", task2: "Task 2" };
const minWordsOf = (a) => (a.taskType === "task2" ? 250 : 150);
const assignmentOf = (id) => state.assignments.find((a) => a.id === id);

function promptBlock(a) {
  return `<div class="prompt">${esc(a.prompt)}</div>
    ${a.promptImage ? `<div class="thumbs" style="margin-top:8px"><img data-zoom src="/uploads/${esc(a.promptImage)}"></div>` : ""}`;
}

// ---------- Giáo viên: giao bài ----------

// a: bài tập cần sửa (không truyền = giao bài mới)
function renderNewForm(a = null) {
  $("#content").innerHTML = `<div class="card">
    <h2>${a ? "Sửa bài tập" : "Giao bài mới"}</h2>
    <form id="newForm">
      <label>Tiêu đề</label><input name="title" required placeholder="VD: Task 2 – Education" value="${esc(a?.title || "")}">
      <div class="row">
        <div class="grow"><label>Loại bài</label><select name="taskType"><option value="task2">Task 2 – Essay</option><option value="task1" ${a?.taskType === "task1" ? "selected" : ""}>Task 1 Academic – Report (biểu đồ)</option><option value="task1gt" ${a?.taskType === "task1gt" ? "selected" : ""}>Task 1 General – Letter (thư)</option></select></div>
        <div class="grow"><label>Hạn nộp</label><input type="date" name="dueDate" value="${esc(a?.dueDate || "")}"></div>
      </div>
      <label>Đề bài</label><textarea name="prompt" rows="6" required>${esc(a?.prompt || "")}</textarea>
      <label>Ảnh biểu đồ/bản đồ (cho Task 1, không bắt buộc)${a?.promptImage ? " – chọn ảnh mới để thay" : ""}</label>
      ${a?.promptImage ? `<div class="row" style="margin-bottom:6px"><img data-zoom src="/uploads/${esc(a.promptImage)}" style="height:80px;border-radius:6px;border:1px solid var(--line)"><label style="margin:0"><input type="checkbox" name="removeImage" value="1" style="width:auto"> Bỏ ảnh này</label></div>` : ""}
      <input type="file" name="promptImage" accept="image/*,.heic,.heif">
      <div class="row" style="margin-top:12px"><button class="primary">${a ? "Lưu thay đổi" : "Giao bài"}</button>${a ? '<button type="button" id="cancelEdit">Huỷ</button>' : ""}<span id="formMsg"></span></div>
    </form></div>`;
  if (a) $("#cancelEdit").onclick = () => openAssignment(a.id);
  $("#newForm").onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector("button.primary"); btn.disabled = true;
    const fd = new FormData(e.target);
    const img = fd.get("promptImage");
    if (img && img.size) fd.set("promptImage", await compressImage(img)); else fd.delete("promptImage");
    try {
      const a2 = await api(a ? `/api/assignments/${a.id}` : "/api/assignments", { method: a ? "PUT" : "POST", body: fd });
      await loadAssignments();
      openAssignment(a2.id);
    } catch (err) { btn.disabled = false; $("#formMsg").innerHTML = `<span class="notice bad">${esc(err.message)}</span>`; }
  };
}

// ---------- Giáo viên: theo dõi bài nộp ----------

async function renderTeacherAssignment() {
  const a = assignmentOf(state.selected);
  const subs = await api(`/api/submissions?assignmentId=${a.id}`);
  const students = state.users.filter((u) => u.role === "student");
  const done = subs.filter((s) => ["graded", "reviewed"].includes(s.status)).length;
  $("#content").innerHTML = `<div class="card">
      <div class="row"><h2 class="grow">${esc(a.title)}</h2><button id="editBtn">Sửa</button><button id="delBtn">Xoá bài tập</button></div>
      <p class="muted">${TASK_NAME[a.taskType] || "Task 2"} · ${a.dueDate ? "Hạn " + esc(a.dueDate) : "Không hạn"} · Đã nộp ${done}/${students.length}</p>
      ${promptBlock(a)}
    </div>
    <div class="card"><h2>Bài nộp của học viên</h2>
      <table><tr><th>Học viên</th><th>Trạng thái</th><th>AI chấm</th><th>Điểm GV</th></tr>
      ${students.map((st) => {
        const s = subs.find((x) => x.studentId === st.id);
        const [label, cls] = STATUS[s?.status || "draft"];
        return `<tr class="${s?.grade ? "click" : ""}" data-sub="${s?.grade ? s.id : ""}">
          <td>${esc(st.name)}</td><td><span class="pill ${cls}">${label}</span>${s?.editedAfterOcr ? ' <span class="pill warn" title="Học viên đã sửa bản chép từ ảnh">đã sửa bản chép</span>' : ""}</td>
          <td>${fmtBand(s?.grade?.overall_band)}</td><td>${fmtBand(s?.review?.band)}</td></tr>`;
      }).join("")}</table>
    </div><div id="subDetail"></div>`;
  $("#editBtn").onclick = () => renderNewForm(a);
  $("#delBtn").onclick = async () => {
    if (!confirm("Xoá bài tập này và toàn bộ bài nộp?")) return;
    await api(`/api/assignments/${a.id}`, { method: "DELETE" });
    await loadAssignments();
    $("#content").innerHTML = `<div class="card empty">Đã xoá.</div>`;
  };
  $("#content").querySelectorAll("tr[data-sub]").forEach((tr) => {
    if (tr.dataset.sub) tr.onclick = () => renderTeacherSubmission(subs.find((s) => s.id === tr.dataset.sub));
  });
}

function renderTeacherSubmission(s) {
  const st = state.users.find((u) => u.id === s.studentId);
  const el = $("#subDetail");
  el.innerHTML = `<div class="card">
      <h2>Bài của ${esc(st.name)}</h2>
      ${s.images.length ? `<h3>Ảnh bài viết tay</h3><div class="thumbs">${s.images.map((n) => `<img data-zoom src="/uploads/${esc(n)}">`).join("")}</div>` : `<p class="muted">Học viên tự gõ bài (không có ảnh).</p>`}
      ${s.editedAfterOcr ? `<div class="notice warn">Học viên đã sửa bản chép do AI đọc từ ảnh. Hãy so với ảnh gốc để chắc học viên chỉ sửa chỗ máy đọc nhầm, không chữa lỗi của chính mình.</div>
        <details><summary>Xem bản AI đọc từ ảnh (trước khi học viên sửa)</summary><div class="prompt">${esc(s.ocr.transcript)}</div></details>` : ""}
    </div>
    <div class="card">${gradeView(s.grade, s.text)}</div>
    <div class="card"><h2>Giáo viên duyệt</h2>
      <form id="reviewForm">
        <div class="row"><div style="width:140px"><label>Band cuối cùng</label><input name="band" type="number" min="0" max="9" step="0.5" value="${s.review?.band ?? s.grade.overall_band}"></div></div>
        <label>Nhận xét của giáo viên</label><textarea name="comment" rows="3">${esc(s.review?.comment || "")}</textarea>
        <div class="row" style="margin-top:10px"><button class="primary">${s.review ? "Cập nhật" : "Duyệt & trả bài"}</button><span id="revMsg"></span></div>
      </form></div>`;
  $("#reviewForm").onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    try {
      await postJson(`/api/submissions/${s.id}/review`, { band: fd.get("band"), comment: fd.get("comment") });
      await renderTeacherAssignment();
      $("#subDetail").innerHTML = `<div class="notice ok">Đã lưu điểm duyệt cho ${esc(st.name)}.</div>`;
    } catch (err) { $("#revMsg").innerHTML = `<span class="notice bad">${esc(err.message)}</span>`; }
  };
  el.scrollIntoView({ behavior: "smooth" });
}

// ---------- Hiển thị kết quả chấm ----------

const ERR_TYPE = {
  grammar: "Ngữ pháp", spelling: "Chính tả", punctuation: "Dấu câu", word_choice: "Dùng từ sai", vocabulary: "Từ vựng",
  information: "Sai thông tin", coherence: "Liên kết", redundancy: "Thừa chữ", naturalness: "Chưa tự nhiên",
};
const MINOR_TYPES = ["redundancy", "naturalness"];
// Bài chấm cũ chưa có "severity" → suy ra từ loại lỗi
const severityOf = (e) => e.severity || (MINOR_TYPES.includes(e.type) ? "minor" : "major");

// Tô màu lỗi ngay trong bài: đỏ = lỗi nặng, vàng = lỗi nhẹ. Trả về { html, found: Set(chỉ số lỗi định vị được) }
function annotate(text, errors) {
  const ranges = [];
  errors.forEach((e, i) => {
    const words = e.original.trim().split(/\s+/).map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/['’‘]/g, "['’‘]"));
    if (!words[0]) return;
    const re = new RegExp(words.join("\\s+"), "gi");
    let m;
    while ((m = re.exec(text))) {
      const [s, t] = [m.index, m.index + m[0].length];
      if (!ranges.some((r) => s < r.end && t > r.start)) { ranges.push({ start: s, end: t, i }); break; }
    }
  });
  ranges.sort((a, b) => a.start - b.start);
  let html = "", pos = 0;
  for (const r of ranges) {
    const e = errors[r.i];
    html += esc(text.slice(pos, r.start)) +
      `<mark class="err ${severityOf(e)}" data-err="${r.i}" title="${esc(e.correction)}">${esc(text.slice(r.start, r.end))}<sup>${r.i + 1}</sup></mark>`;
    pos = r.end;
  }
  return { html: html + esc(text.slice(pos)), found: new Set(ranges.map((r) => r.i)) };
}

// Bấm vào chỗ tô màu → làm nổi bật lời giải thích tương ứng (và ngược lại)
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-err]");
  if (!t) return;
  const box = t.closest(".card") || document;
  box.querySelectorAll(".active-err").forEach((n) => n.classList.remove("active-err"));
  box.querySelectorAll(`[data-err="${t.dataset.err}"]`).forEach((n) => n.classList.add("active-err"));
  const other = [...box.querySelectorAll(`[data-err="${t.dataset.err}"]`)].find((n) => n !== t);
  other?.scrollIntoView({ behavior: "smooth", block: "nearest" });
});

function errorsView(g, text) {
  if (!text) return "";
  const { html, found } = annotate(text, g.errors);
  const major = g.errors.filter((e) => severityOf(e) === "major").length;
  return `<h3>Bài làm có đánh dấu lỗi</h3>
    <p class="muted"><mark class="err major">đỏ</mark> lỗi nặng, ảnh hưởng trực tiếp đến band (${major}) ·
      <mark class="err minor">vàng</mark> lỗi nhẹ, ít ảnh hưởng (${g.errors.length - major}) · bấm vào chỗ tô màu để xem cách sửa</p>
    <div class="essay">${html}</div>
    ${g.errors.length ? `<ol class="errlist">${g.errors.map((e, i) => `<li data-err="${i}" class="${severityOf(e)}">
        <span class="pill ${severityOf(e) === "major" ? "bad" : "warn"}">${ERR_TYPE[e.type] || e.type}</span>
        “${esc(e.original)}” → <b class="fix">${esc(e.correction)}</b>${found.has(i) ? "" : ' <span class="muted">(không tìm thấy vị trí trong bài)</span>'}
        <div class="muted">${esc(e.explanation)}</div></li>`).join("")}</ol>` : `<p class="notice ok">Không phát hiện lỗi đáng kể.</p>`}`;
}

function gradeView(g, text, title = "Kết quả AI chấm") {
  const crit = [["task", "Task Achievement/Response"], ["coherence", "Coherence & Cohesion"], ["lexical", "Lexical Resource"], ["grammar", "Grammar Range & Accuracy"]];
  return `<h2>${title}</h2>
    <div class="overall"><div class="big">${fmtBand(g.overall_band)}</div><div class="muted">Band tổng (AI ước tính)${g.band_range ? ` · khung ước lượng <b>${fmtBand(g.band_range[0])}–${fmtBand(g.band_range[1])}</b>` : ""}<br>${g.word_count} từ${g.model ? ` · chấm bởi <b>${esc(g.model)}</b>` : ""}</div></div>
    <div class="bands">${crit.map(([k, n]) => `<div class="band"><span class="muted">${n}</span><b>${fmtBand(g[k].band)}</b>${g[k].range ? `<span class="muted">khung ${fmtBand(g[k].range[0])}–${fmtBand(g[k].range[1])}</span>` : ""}</div>`).join("")}</div>
    ${crit.map(([k, n]) => `<h3>${n} – ${fmtBand(g[k].band)}</h3>${g[k].range_reason ? `<div class="muted">Khung ${fmtBand(g[k].range[0])}–${fmtBand(g[k].range[1])}: ${esc(g[k].range_reason.join("; "))}</div>` : ""}<div>${esc(g[k].comment)}</div>`).join("")}
    <h3>Điểm mạnh</h3><ul>${g.strengths.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
    <h3>Cần cải thiện</h3><ul>${g.improvements.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
    ${errorsView(g, text)}
    <details><summary>Xem bài viết mẫu đã cải thiện (~Band 7.5)</summary><div class="improved">${esc(g.improved_version)}</div></details>`;
}

// ---------- Học viên ----------

async function renderStudentAssignment() {
  const a = assignmentOf(state.selected);
  const sub = await postJson("/api/submissions", { assignmentId: a.id, studentId: state.me.id });
  state.subId = sub.id;
  const head = `<div class="card"><h2>${esc(a.title)}</h2>
    <p class="muted">${TASK_NAME[a.taskType] || "Task 2"} – ít nhất ${minWordsOf(a)} từ · ${a.dueDate ? "Hạn " + esc(a.dueDate) : "Không hạn"}</p>${promptBlock(a)}</div>`;

  if (sub.status === "reviewed" || sub.status === "graded") {
    $("#content").innerHTML = head +
      (sub.review ? `<div class="card"><h2>Giáo viên đã chấm: Band ${fmtBand(sub.review.band)}</h2>${sub.review.comment ? `<div class="prompt">${esc(sub.review.comment)}</div>` : ""}</div>`
                  : `<div class="notice info">AI đã chấm xong. Giáo viên sẽ xem và duyệt điểm cuối cùng.</div>`) +
      (sub.status === "graded" ? `<div class="row" style="margin-bottom:14px"><button id="redoBtn">Làm lại & nộp lại</button></div>` : "") +
      `<div class="card">${gradeView(sub.grade, sub.text)}</div>`;
    if ($("#redoBtn")) $("#redoBtn").onclick = () => renderStudentEditor(a, { ...sub, status: "draft" }, head);
    return;
  }
  renderStudentEditor(a, sub, head);
}

function renderStudentEditor(a, sub, head) {
  const hasTranscript = sub.status === "transcribed";
  const minWords = minWordsOf(a);
  $("#content").innerHTML = head + `
    <div class="card">
      <h2>Bước 1 – Chụp bài viết tay</h2>
      <p class="muted">Chụp thẳng, đủ sáng, mỗi trang một ảnh, chọn theo đúng thứ tự trang (tối đa 6 ảnh).</p>
      <div class="row">
        <input type="file" id="pages" accept="image/*,.heic,.heif" multiple style="width:auto" class="grow">
        <button class="primary" id="ocrBtn">AI đọc bài</button>
      </div>
      <div id="previews" class="thumbs" style="margin-top:8px"></div>
      <p class="muted" style="margin-top:10px">Hoặc <a href="#" id="typeLink">tự gõ bài trên máy</a> (bỏ qua bước chụp ảnh).</p>
      <div id="ocrMsg"></div>
    </div>
    <div class="card" id="step2" ${hasTranscript || state.typing ? "" : "hidden"}>
      <h2>Bước 2 – Soát bản chép & nộp chấm</h2>
      ${hasTranscript ? `<div class="notice warn">Chỉ sửa những chỗ <b>AI đọc nhầm</b> so với ảnh. Không chữa lỗi của chính bạn – giáo viên sẽ thấy những chỗ bạn đã sửa.</div>` : ""}
      ${hasTranscript && sub.ocr.model ? `<p class="muted">Bản chép do <b>${esc(sub.ocr.model)}</b> đọc từ ảnh.</p>` : ""}
      ${hasTranscript && sub.ocr.legibility === "poor" ? `<div class="notice bad">Ảnh/chữ khá khó đọc. Nên chụp lại rõ hơn để AI đọc chính xác.</div>` : ""}
      ${hasTranscript && sub.ocr.unclear.length ? `<div class="notice info"><b>Những chỗ AI không chắc:</b><ul style="margin:4px 0">${sub.ocr.unclear.map((u) => `<li><b>${esc(u.text)}</b> – ${esc(u.note)}</li>`).join("")}</ul></div>` : ""}
      <div class="${hasTranscript ? "split" : ""}">
        ${hasTranscript ? `<div class="imgcol">${sub.images.map((n) => `<img data-zoom src="/uploads/${esc(n)}">`).join("")}</div>` : ""}
        <div><textarea id="essay" rows="18">${esc(hasTranscript ? sub.text : "")}</textarea>
          <div class="muted" id="wc"></div></div>
      </div>
      <div class="row" style="margin-top:10px"><button class="primary" id="gradeBtn">Nộp bài & chấm điểm</button><span id="gradeMsg"></span></div>
    </div>`;

  const updateWc = () => {
    const n = wordCount($("#essay").value);
    $("#wc").innerHTML = `${n} từ ${n < minWords ? `<span style="color:var(--bad)">(dưới ${minWords} từ – sẽ bị trừ điểm)</span>` : ""}`;
  };
  $("#essay").oninput = updateWc; updateWc();

  $("#typeLink").onclick = (e) => { e.preventDefault(); state.typing = true; $("#step2").hidden = false; $("#essay").focus(); };

  $("#pages").onchange = () => {
    $("#previews").innerHTML = [...$("#pages").files].map((f) => isHeic(f) ? `<span class="pill">📷 ${esc(f.name)}</span>` : `<img data-zoom src="${URL.createObjectURL(f)}">`).join("");
  };

  $("#ocrBtn").onclick = async () => {
    const files = [...$("#pages").files];
    if (!files.length) { $("#ocrMsg").innerHTML = `<div class="notice bad">Hãy chọn ít nhất 1 ảnh.</div>`; return; }
    if (files.length > 6) { $("#ocrMsg").innerHTML = `<div class="notice bad">Tối đa 6 ảnh.</div>`; return; }
    const btn = $("#ocrBtn"); btn.disabled = true;
    $("#ocrMsg").innerHTML = `<div class="notice info"><span class="spinner"></span> AI đang đọc chữ viết tay… (khoảng 10–40 giây)</div>`;
    try {
      const fd = new FormData();
      for (const f of files) fd.append("pages", await compressImage(f));
      const updated = await api(`/api/submissions/${sub.id}/transcribe`, { method: "POST", body: fd });
      state.typing = false;
      await loadAssignments();
      renderStudentEditor(a, updated, head);
      $("#step2").scrollIntoView({ behavior: "smooth" });
    } catch (err) {
      $("#ocrMsg").innerHTML = `<div class="notice bad">${esc(err.message)}</div>`; btn.disabled = false;
    }
  };

  $("#gradeBtn").onclick = async () => {
    const btn = $("#gradeBtn"); btn.disabled = true;
    $("#gradeMsg").innerHTML = `<span class="notice info"><span class="spinner"></span> AI đang chấm… (khoảng 20–60 giây)</span>`;
    try {
      await postJson(`/api/submissions/${sub.id}/grade`, { text: $("#essay").value });
      state.typing = false;
      await loadAssignments();
      renderStudentAssignment();
    } catch (err) {
      $("#gradeMsg").innerHTML = `<span class="notice bad">${esc(err.message)}</span>`; btn.disabled = false;
    }
  };
}

init().catch((e) => { $("#content").innerHTML = `<div class="notice bad">Không tải được dữ liệu: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
